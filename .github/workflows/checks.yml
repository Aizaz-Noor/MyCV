name: Portfolio checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - name: Mobile WebKit regression checks
        run: npx playwright test e2e/mobile-motion.spec.js e2e/artwork-mobile.spec.js --reporter=list --output=test-results/webkit
        env:
          PLAYWRIGHT_BROWSER: webkit
